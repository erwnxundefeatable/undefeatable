        /* Subtle Vignette Overlay */

            position: absolute;
            inset: 0;
            z-index: 5;
            pointer-events: none;
            background: radial-gradient(circle at center, transparent 30%, rgba(5, 5, 5, 0.9) 85%);

        /* Sophisticated Monochromatic Typography */
        .hero-title {
            font-family: 'Space Grotesk', 'Inter', sans-serif;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.35em;
            text-indent: 0.35em; /* Optical centering compensation */
            text-shadow: 
                0 0 20px rgba(255, 255, 255, 0.4),
                0 0 60px rgba(255, 255, 255, 0.15);
            animation: fadeInScale 1.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeInScale {
            0% {
                opacity: 0;
                transform: scale(0.96);
                letter-spacing: 0.5em;
            }
            100% {
                opacity: 1;
                transform: scale(1);
                letter-spacing: 0.35em;
            }
        }

        /* Minimal Badge Button Styles */
        .social-badge {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .social-badge:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 10px 30px -10px rgba(255, 255, 255, 0.15);
        }
    </style>

    <!-- Interactive Canvas & Binary Logic Script -->
    <script>
        const canvas = document.getElementById('binary-canvas');
        const ctx = canvas.getContext('2d');

        // Mouse tracking for subtle lighting interaction
        const mouse = {
            x: -1000,
            y: -1000,
            radius: 160
        };

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        window.addEventListener('mouseleave', () => {
            mouse.x = -1000;
            mouse.y = -1000;
        });

        // Canvas Setup & Resize
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            initColumns();
        }

        const fontSize = 15;
        let columns = 0;
        let drops = [];

        function initColumns() {
            columns = Math.floor(canvas.width / fontSize);
            drops = [];
            for (let i = 0; i < columns; i++) {
                drops[i] = Math.random() * -100;
            }
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Render Loop
        function drawBinaryRain() {
            // Subtle dark fade trail for high elegance
            ctx.fillStyle = 'rgba(5, 5, 5, 0.09)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.font = `${fontSize}px 'JetBrains Mono', monospace`;

            for (let i = 0; i < drops.length; i++) {
                const text = Math.random() > 0.5 ? '1' : '0';
                const x = i * fontSize;
                const y = drops[i] * fontSize;

                // Distance-based hover luminosity
                const dx = x - mouse.x;
                const dy = y - mouse.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < mouse.radius) {
                    ctx.fillStyle = `rgba(255, 255, 255, ${Math.max(0.4, 1 - dist / mouse.radius)})`;
                    ctx.shadowColor = 'rgba(255, 255, 255, 0.5)';
                    ctx.shadowBlur = 8;
                } else {
                    // Soft monochromatic baseline (Translucent White)
                    ctx.fillStyle = Math.random() > 0.98 ? 'rgba(255, 255, 255, 0.45)' : 'rgba(255, 255, 255, 0.08)';
                    ctx.shadowBlur = 0;
                }

                ctx.fillText(text, x, y);

                if (y > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }

                drops[i] += 1.0;
            }

            requestAnimationFrame(drawBinaryRain);
        }

        // Start render loop
        drawBinaryRain();

        // Fullscreen Toggle Handler
        const fsBtn = document.getElementById('fullscreen-btn');
        const expandIcon = document.getElementById('expand-icon');
        const compressIcon = document.getElementById('compress-icon');

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log(`Error attempting to enable fullscreen: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        fsBtn.addEventListener('click', toggleFullscreen);

        document.addEventListener('fullscreenchange', () => {
            if (document.fullscreenElement) {
                expandIcon.classList.add('hidden');
                compressIcon.classList.remove('hidden');
            } else {
                expandIcon.classList.remove('hidden');
                compressIcon.classList.add('hidden');
            }
        });

        // Autoplay Spotify on first user click anywhere on the page
        let hasInteracted = false;
        window.addEventListener('click', () => {
            if (!hasInteracted) {
                hasInteracted = true;
                const iframe = document.getElementById('spotify-iframe');
                // Reload iframe with autoplay parameter set
                iframe.src = "https://open.spotify.com/embed/track/3xf9GbVqLnDgL2x0xztcTV?utm_source=generator&theme=0&autoplay=1";
            }
        }, { once: true });
    </script>
